name: build-and-release-ps-module

on:
  workflow_call:
    inputs:
      # inputs
      version:
        description: Semantic version without a leading v. PowerGallaery adds some limitations for version scheme.
        required: true
        type: string
      moduleName:
        description: PowerShell module name
        required: true
        type: string
      modulePath:
        description: Path to the module source directory
        required: true
        type: string

      # GitHub Packages NuGet feed configuration supplied by the caller
      publishToGitHubPackagesNuGetFeed:
        description: Publish the module to the caller-configured GitHub Packages NuGet feed
        required: true
        type: boolean
        default: false
      gitHubPackagesNuGetFeedOrganizationName:
        description: Organization name used as the credential username for the GitHub Packages NuGet feed
        required: false
        type: string
      gitHubPackagesNuGetFeedRepositoryName:
        description: Local PSResource repository name assigned to the caller's GitHub Packages NuGet feed
        required: false
        type: string
      gitHubPackagesNuGetFeedUri:
        description: NuGet endpoint URI of the caller's GitHub Packages feed
        required: false
        type: string

      # GitHub Container Registry configuration
      publishToGitHubContainerRegistry:
        description: Publish the module package as an OCI artifact to GitHub Container Registry
        required: true
        type: boolean
        default: false
      gitHubContainerRegistryOrganizationName:
        description: GHCR organization name; defaults to the repository owner
        required: false
        type: string
      gitHubContainerRegistryPackageName:
        description: GHCR package name; defaults to the PowerShell module name
        required: false
        type: string

      # PowerShell Gallery feed configuration
      publishToPowerShellGallery:
        description: Publish the package to PowerShell Gallery
        required: true
        type: boolean
        default: false
      psGalleryRepositoryName:
        description: Registered PSResource repository name for PowerShell Gallery
        required: false
        type: string
        default: PSGallery

      # GitHub Release configuration
      publishToGitHubRelease:
        description: Create or update the GitHub Release for v{version} and upload the module package
        required: true
        type: boolean
        default: false

      # attestation generation overrides
      generateAttestation:
        description: Override attestation generation with true or false; auto generates stable attestations only
        required: false
        type: string
        default: auto

    secrets:
      githubToken:
        description: Token used to publish to GitHub Packages(nuget feed)
        required: false
      galleryApiKey:
        description: API key used to publish to PowerShell Gallery
        required: false
      gitHubReleaseToken:
        description: Token used to create or update the GitHub Release
        required: false
      gitHubContainerRegistryToken:
        description: Token with packages write permission used to publish to GHCR
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate attestation option
        shell: pwsh
        env:
          GENERATE_ATTESTATION: ${{ inputs.generateAttestation }}
        run: |
          if ($env:GENERATE_ATTESTATION -notin @("auto", "true", "false")) {
              throw "generateAttestation must be auto, true, or false."
          }

      - name: Validate GitHub Packages configuration
        if: inputs.publishToGitHubPackagesNuGetFeed == true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.githubToken }}
          ORGANIZATION_NAME: ${{ inputs.gitHubPackagesNuGetFeedOrganizationName }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              throw "The githubToken secret is required when publishToGitHubPackagesNuGetFeed is enabled."
          }

          if ([string]::IsNullOrWhiteSpace($env:ORGANIZATION_NAME)) {
              throw "The gitHubPackagesNuGetFeedOrganizationName input is required when publishToGitHubPackagesNuGetFeed is enabled."
          }

      - name: Validate PowerShell Gallery secret
        if: inputs.publishToPowerShellGallery == true
        shell: pwsh
        env:
          GALLERY_API_KEY: ${{ secrets.galleryApiKey }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GALLERY_API_KEY)) {
              throw "The galleryApiKey secret is required when publishToPowerShellGallery is enabled."
          }

      - name: Validate GitHub Container Registry secret
        if: inputs.publishToGitHubContainerRegistry == true
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.gitHubContainerRegistryToken }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GHCR_TOKEN)) {
              throw "The gitHubContainerRegistryToken secret is required when publishToGitHubContainerRegistry is enabled."
          }

      - name: Validate GitHub Release secret
        if: inputs.publishToGitHubRelease == true
        shell: pwsh
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.gitHubReleaseToken }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_RELEASE_TOKEN)) {
              throw "The gitHubReleaseToken secret is required when publishToGitHubRelease is enabled."
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build module artifact (staging)
        id: build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MODULE_NAME: ${{ inputs.moduleName }}
          MODULE_PATH: ${{ inputs.modulePath }}
        run: |
          try {
              $semver = [System.Management.Automation.SemanticVersion]::Parse($env:RELEASE_VERSION)
          }
          catch {
              throw "Invalid SemVer version: $env:RELEASE_VERSION"
          }

          $moduleVersion = "$($semver.Major).$($semver.Minor).$($semver.Patch)"
          $isPrerelease = -not [string]::IsNullOrWhiteSpace($semver.PreReleaseLabel)

          "isPrerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $stagingPath = Join-Path "./dist" $env:MODULE_NAME
          Remove-Item "./dist" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          Copy-Item (Join-Path $env:MODULE_PATH "*") $stagingPath -Recurse

          $manifestPath = Join-Path $stagingPath "$($env:MODULE_NAME).psd1"
          $params = @{
              Path          = $manifestPath
              ModuleVersion = $moduleVersion
          }

          if ($isPrerelease) {
              $params.Prerelease = $semver.PreReleaseLabel
          }

          Update-PsModuleManifest @params

      - name: Package module (.nupkg)
        id: package
        shell: pwsh
        env:
          MODULE_NAME: ${{ inputs.moduleName }}
        run: |
          New-Item -ItemType Directory -Path "./artifacts" -Force | Out-Null
          $packagePath = Compress-PSResource -PassThru `
            -Path (Join-Path "./dist" $env:MODULE_NAME) `
            -DestinationPath "./artifacts"

          "packagePath=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate artifact attestation
        if: inputs.generateAttestation == 'true' || (inputs.generateAttestation == 'auto' && steps.build.outputs.isPrerelease == 'False')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.packagePath }}

      - name: Publish package to GitHub Release
        if: inputs.publishToGitHubRelease == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.gitHubReleaseToken }}
          PACKAGE_PATH: ${{ steps.package.outputs.packagePath }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.build.outputs.isPrerelease }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $isDraft = gh release view $tag `
            --repo $env:REPOSITORY `
            --json isDraft `
            --jq .isDraft 2> $null

          if ($LASTEXITCODE -ne 0) {
              $arguments = @(
                  "release", "create", $tag,
                  "--repo", $env:REPOSITORY,
                  "--verify-tag",
                  "--generate-notes",
                  "--draft",
                  "--title", $tag
              )

              if ($env:IS_PRERELEASE -eq "True") {
                  $arguments += "--prerelease"
              }

              & gh @arguments
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create draft GitHub Release $tag."
              }
          }
          elseif ($isDraft -ne "true") {
              throw "GitHub Release $tag already exists and is not a draft. Assets cannot be changed when immutable releases are enabled."
          }

          gh release upload $tag $env:PACKAGE_PATH `
            --repo $env:REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $env:PACKAGE_PATH to GitHub Release $tag."
          }

          gh release edit $tag `
            --repo $env:REPOSITORY `
            --draft=false

          if ($LASTEXITCODE -ne 0) {
              throw "Uploaded $env:PACKAGE_PATH, but failed to publish draft GitHub Release $tag."
          }

      - name: Setup GitHub Packages repository
        if: inputs.publishToGitHubPackagesNuGetFeed == true
        shell: pwsh
        env:
          REPOSITORY_NAME: ${{ inputs.gitHubPackagesNuGetFeedRepositoryName }}
          REPOSITORY_URI: ${{ inputs.gitHubPackagesNuGetFeedUri }}
        run: |
          Register-PSResourceRepository `
            -Name $env:REPOSITORY_NAME `
            -Uri $env:REPOSITORY_URI `
            -Trusted

      - name: Publish to GitHub Packages
        if: inputs.publishToGitHubPackagesNuGetFeed == true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.githubToken }}
          ORGANIZATION_NAME: ${{ inputs.gitHubPackagesNuGetFeedOrganizationName }}
          PACKAGE_PATH: ${{ steps.package.outputs.packagePath }}
          REPOSITORY_NAME: ${{ inputs.gitHubPackagesNuGetFeedRepositoryName }}
        run: |
          $secureToken = ConvertTo-SecureString $env:GITHUB_TOKEN -AsPlainText -Force
          $credential = [System.Management.Automation.PSCredential]::new(
            $env:ORGANIZATION_NAME,
            $secureToken
          )

          Publish-PSResource `
            -NupkgPath $env:PACKAGE_PATH `
            -Repository $env:REPOSITORY_NAME `
            -Credential $credential `
            -SkipDependenciesCheck

      # PSResourceGet's container registry support is limited to Azure Container Registry,
      # so GHCR publication uses ORAS directly.
      - name: Setup ORAS
        if: inputs.publishToGitHubContainerRegistry == true
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0

      - name: Publish package to GitHub Container Registry
        if: inputs.publishToGitHubContainerRegistry == true
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.gitHubContainerRegistryToken }}
          GHCR_ORGANIZATION: ${{ inputs.gitHubContainerRegistryOrganizationName }}
          GHCR_PACKAGE_NAME: ${{ inputs.gitHubContainerRegistryPackageName }}
          DEFAULT_ORGANIZATION: ${{ github.repository_owner }}
          DEFAULT_PACKAGE_NAME: ${{ inputs.moduleName }}
          PACKAGE_PATH: ${{ steps.package.outputs.packagePath }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $organization = if ([string]::IsNullOrWhiteSpace($env:GHCR_ORGANIZATION)) {
              $env:DEFAULT_ORGANIZATION
          }
          else {
              $env:GHCR_ORGANIZATION
          }

          $packageName = if ([string]::IsNullOrWhiteSpace($env:GHCR_PACKAGE_NAME)) {
              $env:DEFAULT_PACKAGE_NAME
          }
          else {
              $env:GHCR_PACKAGE_NAME
          }

          $organization = $organization.ToLowerInvariant()
          $packageName = $packageName.ToLowerInvariant()
          $tag = $env:RELEASE_VERSION.Replace("+", "_")
          $reference = "ghcr.io/$organization/${packageName}:$tag"
            $relativePackagePath = [System.IO.Path]::GetRelativePath(
              (Get-Location).Path,
              $env:PACKAGE_PATH
            )

          $env:GHCR_TOKEN | oras login ghcr.io `
            --username $env:GITHUB_ACTOR_NAME `
            --password-stdin

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to authenticate with GitHub Container Registry."
          }

          try {
              oras push $reference `
                --artifact-type "application/vnd.microsoft.powershell.module" `
                --annotation "org.opencontainers.image.title=$packageName" `
                --annotation "org.opencontainers.image.version=$env:RELEASE_VERSION" `
                --annotation "org.opencontainers.image.source=$env:SOURCE_URL" `
                "${relativePackagePath}:application/vnd.microsoft.powershell.module.nupkg"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to publish $env:PACKAGE_PATH to $reference."
              }
          }
          finally {
              oras logout ghcr.io
          }


      # GitHub NuGet feed requires an authentication token even when set to public
      - name: Publish to PowerShell Gallery
        if: inputs.publishToPowerShellGallery == true
        shell: pwsh
        env:
          GALLERY_API_KEY: ${{ secrets.galleryApiKey }}
          PACKAGE_PATH: ${{ steps.package.outputs.packagePath }}
          REPOSITORY_NAME: ${{ inputs.psGalleryRepositoryName }}
        run: |
          Publish-PSResource `
            -NupkgPath $env:PACKAGE_PATH `
            -Repository $env:REPOSITORY_NAME `
            -ApiKey $env:GALLERY_API_KEY `
            -SkipDependenciesCheck
